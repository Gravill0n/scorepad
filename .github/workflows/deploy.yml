# Scorepad ships as a GitHub Pages project page. This workflow is a quality
# gate before it is a deploy: a red suite must never reach the URL people
# install from, because an installed PWA keeps serving itself from cache and a
# bad deploy outlives the fix.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run by hand without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time, and never cancel one mid-flight — a half-uploaded
  # artifact is a broken site. In-progress PR checks are fine to cancel.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # The project sub-path. vite.config.ts defaults to "/" so local
          # development and the test suite are unaffected.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Assert the bundle carries no server entry
        # Criterion 1, enforced by the host as well as by the config: Pages
        # cannot serve a server entry, so one appearing is a broken deploy.
        run: |
          test ! -e dist/server
          test ! -e dist/client/server.js
          test -f dist/client/index.html
          test -f dist/client/404.html

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Deploy to Pages
    # The gate: nothing below runs unless everything above passed.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
